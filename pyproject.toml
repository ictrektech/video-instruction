[project]
name = "video-instruction"
# 版本不写在本文件：本文件与 uv.lock 是镜像依赖层的缓存键，
# 写死版本会导致每次发版重建依赖层。版本统一取自 ictrek.app/VERSION
# （VOS 发版时由 ictrek.app/scripts/update_version.sh bump）。
dynamic = ["version"]
description = "video-instruction - FastAPI project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.3",
  "rich>=13.7.0",
  "huey>=3.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[project.scripts]
scene-detect = "scene_detect.__main__:main"
structure = "structure.__main__:main"
scene-detect-worker = "scene_detect.worker:main"
structure-worker = "structure.worker:main"

[project.optional-dependencies]
scene-detect = [
  "scenedetect>=0.7",
]
structure = [
  "Pillow>=11.0.0",
  "numpy>=1.26.0",
  "openai>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "pre-commit>=3.7.0",
  "watchfiles>=1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "SIM", "S", "T20"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.ruff.lint.isort]
order-by-type = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 避免 tests/scene_detect 与 src/scene_detect 包名冲突
addopts = "--import-mode=importlib"

[tool.hatch.version]
path = "ictrek.app/VERSION"
pattern = "^(?P<version>.+)$"

# 默认索引指向清华镜像：uv sync --frozen 按 uv.lock 里记录的 URL 下载，
# 让 lock 生成时就记录可达源（国内构建机直连 pypi 会超时）。
# 修改索引后需重新 uv lock 使其写入 lock 文件。
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
