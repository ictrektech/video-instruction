[project]
name = "video-instruction"
version = "0.1.0"
description = "video-instruction - FastAPI project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.3",
  "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[project.scripts]
scene-detect = "scene_detect.__main__:main"
structure = "structure.__main__:main"

[project.optional-dependencies]
scene-detect = [
  "scenedetect>=0.7",
]
structure = [
  "Pillow>=11.0.0",
  "numpy>=1.26.0",
  "openai>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "SIM", "S", "T20"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.ruff.lint.isort]
order-by-type = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
