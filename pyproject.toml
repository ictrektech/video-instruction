[project]
name = "fastapi-template"
version = "0.1.0"
description = "FastAPI 项目模板"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "python-jose>=3.3.0",
  "redis>=5.2.0",
  "slowapi>=0.1.9",
  "sqlmodel>=0.0.31",
  "pyyaml>=6.0.3",
  "rich>=13.7.0",
  "bcrypt>=4.0.0",
  "alembic>=1.13.0",
  "asyncpg>=0.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project.scripts]
serve = "app.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "SIM", "S", "T20"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.ruff.lint.isort]
order-by-type = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: marks tests that require PostgreSQL and Redis"]
