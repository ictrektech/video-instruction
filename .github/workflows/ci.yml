name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      # 单测会 import scene_detect / structure 的运行时模块（numpy、PIL、scenedetect…），
      # 这些依赖声明在 scene-detect / structure 两个 extra 里，dev 并不包含，必须一起装
      - run: uv sync --extra dev --extra scene-detect --extra structure
      - run: uv run pytest -m "not integration" -v
