name: video-instruction-dev



services:
  scene-detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        SERVICE: scene-detect
    container_name: dev-video-detection
    profiles: ["detection"]
    ports:
      - "${SCENE_DETECTION_PORT:-8910}:8910"
    volumes:
      - /data:/data:ro
      - ${UPLOAD_LOCATION}/photos:/photos:ro
      - ../src:/app/src
      - ../tests:/app/tests
      - ../config:/app/config
      - ../log:/app/log
      # README.md for hatchling build
      - ../README.md:/app/README.md
      # Persist .venv across restarts (own volume per service)
      - video-instruction-venv-detection:/app/.venv
      - ../data:/app/data
    environment:
      APP_ENV: dev
      APP_PORT: 8910
      DATA_BASE_PATH: /photos
      TASK_DB_PATH: /app/data/tasks/tasks.db
      TASK_MAX_CONCURRENCY: ${TASK_MAX_CONCURRENCY:-2}
      TASK_QUEUE_LIMIT: ${TASK_QUEUE_LIMIT:-20}
      TASK_RESULT_TTL_SEC: ${TASK_RESULT_TTL_SEC:-3600}
      # 场景检测管道：scale=640 切点稳定；threads=2 兼顾多 worker
      VIDEO_DETECT_SCALE_WIDTH: "640"
      VIDEO_DECODE_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
    networks:
      - video-instruction-dev-net
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        uv sync --frozen --extra dev --extra scene-detect --extra structure
        exec uv run scene-detect

  structure:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        SERVICE: structure
    container_name: dev-video-structure
    profiles: ["structure"]
    ports:
      - "${STRUCTURE_PORT:-8911}:8911"
    volumes:
      - /data:/data:ro                                                   # 读：宿主机 /data/ 下任意路径（无需翻译）
      - ${UPLOAD_LOCATION}/photos:/photos:ro                             # 读：immich 照片（兼容相对路径模式）
      - ../src:/app/src
      - ../tests:/app/tests
      - ../config:/app/config
      - ../log:/app/log
      - ../README.md:/app/README.md
      # Persist .venv across restarts (own volume per service)
      - video-instruction-venv-structure:/app/.venv
      - ../data:/app/data
    environment:
      APP_ENV: dev
      APP_PORT: 8911
      DATA_BASE_PATH: /photos
      TASK_DB_PATH: /app/data/tasks/tasks.db
      TASK_MAX_CONCURRENCY: ${TASK_MAX_CONCURRENCY:-2}
      TASK_QUEUE_LIMIT: ${TASK_QUEUE_LIMIT:-20}
      TASK_RESULT_TTL_SEC: ${TASK_RESULT_TTL_SEC:-3600}
      CALLBACK_RETRY_ATTEMPTS: ${CALLBACK_RETRY_ATTEMPTS:-3}
      CALLBACK_RETRY_DELAY_SEC: ${CALLBACK_RETRY_DELAY_SEC:-1}
      VIDEO_GRID_FFMPEG_THREADS: "2"
      LLM_BASE_URL: http://10.144.144.232:21436/v1
      LLM_API_KEY: sk-fake
      LLM_MODEL_NAME: minicpm-v:latest
      LLM_MAX_CONCURRENCY: 20
      LLM_TRACE_LOG: ${LLM_TRACE_LOG:-false}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
    networks:
      - video-instruction-dev-net
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        uv sync --frozen --extra dev --extra scene-detect --extra structure
        exec uv run structure
volumes:
  video-instruction-venv-detection:
  video-instruction-venv-structure:

networks:
  video-instruction-dev-net:
    driver: bridge
