name: video-instruction-dev

services:
  app-base:
    profiles: ["_base"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      # Source code — mounted live so uvicorn --reload picks up changes
      - ../src:/app/src
      - ../config:/app/config
      - ../log:/app/log
      # README.md for hatchling build
      - ../README.md:/app/README.md
      # Persist .venv across restarts (but not on host — avoid platform mismatch)
      - video-instruction-venv:/app/.venv
    env_file:
      - ../src/.env
    environment:
      APP_ENV: dev
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    networks:
      - video-instruction-dev-net
    restart: unless-stopped

  scene-detection:
    extends: app-base
    container_name: dev-video-detection
    profiles: ["detection"]
    ports:
      - "${SCENE_DETECTION_PORT:-8001}:8910"
    command:
      - bash
      - -c
      - |
        uv sync --frozen --extra dev
        exec uv run scene-detect

  structure:
    extends: app-base
    container_name: dev-video-structure
    profiles: ["structure"]
    ports:
      - "${structure_PORT:-8910}:8910"
    command:
      - bash
      - -c
      - |
        uv sync --frozen --extra dev
        exec uv run structure

video-instruction-venv:

networks:
  video-instruction-dev-net:
    driver: bridge
