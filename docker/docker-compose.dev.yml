name: video-instruction-dev

services:
  scene-detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        SERVICE: scene-detect
    container_name: dev-video-detection
    profiles: ["detection"]
    ports:
      - "${SCENE_DETECTION_PORT:-8910}:8910"
    volumes:
      # Source code — mounted live so uvicorn --reload picks up changes
      - ../src:/app/src
      - ../config:/app/config
      - ../log:/app/log
      # README.md for hatchling build
      - ../README.md:/app/README.md
      # Persist .venv across restarts (own volume per service)
      - video-instruction-venv-detection:/app/.venv
      # Video data volume
      - immich-photos:/data
    environment:
      APP_ENV: dev
      DATA_BASE_PATH: /data
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
    networks:
      - video-instruction-dev-net
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        uv sync --frozen --extra dev --extra scene-detect
        exec uv run scene-detect

  structure:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        SERVICE: structure
    container_name: dev-video-structure
    profiles: ["structure"]
    ports:
      - "${STRUCTURE_PORT:-8911}:8911"
    volumes:
      - ../src:/app/src
      - ../config:/app/config
      - ../log:/app/log
      - ../README.md:/app/README.md
      # Persist .venv across restarts (own volume per service)
      - video-instruction-venv-structure:/app/.venv
      # Video data volume
      - immich-photos:/data
    environment:
      APP_ENV: dev
      APP_PORT: 8911
      DATA_BASE_PATH: /data
      LLM_BASE_URL: http://10.144.144.232:21436/v1
      LLM_API_KEY: sk-fake
      LLM_MODEL_NAME: minicpm-v:latest
      LLM_MAX_CONCURRENCY: 20
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
    networks:
      - video-instruction-dev-net
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        uv sync --frozen --extra dev --extra structure
        exec uv run structure

volumes:
  immich-photos:
    name: dev-immich-photos
    driver: local
    driver_opts:
      type: none
      device: ${UPLOAD_LOCATION}/photos
      o: bind
  video-instruction-venv-detection:
  video-instruction-venv-structure:

networks:
  video-instruction-dev-net:
    driver: bridge
