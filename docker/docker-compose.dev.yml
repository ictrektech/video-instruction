name: fastapi-template-dev

services:
  app-base:
    profiles: ["_base"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      # Source code — mounted live so uvicorn --reload picks up changes
      - ../src:/app/src
      - ../config:/app/config
      - ../log:/app/log
      - ../alembic.ini:/app/alembic.ini
      - ../alembic:/app/alembic
      # README.md for hatchling build
      - ../README.md:/app/README.md
      # Persist .venv across restarts (but not on host — avoid platform mismatch)
      - fastapi-template-venv:/app/.venv
    env_file:
      - ../src/.env
    environment:
      APP_ENV: dev
      DB_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/devdb
      REDIS_URL: redis://redis:6379/0
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    networks:
      - fastapi-template-dev-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app-server:
    extends: app-base
    container_name: dev-fastapi-template
    profiles: ["server"]
    ports:
      - "${APP_PORT:-8910}:8910"
      - "${DEV_DEBUG_PORT:-5678}:5678"
    command:
      - bash
      - -c
      - |
        uv sync --frozen --extra dev
        uv pip install debugpy
        exec uv run -m debugpy --listen 0.0.0.0:5678 -m app.__main__

  postgres:
    image: postgres:18-alpine
    container_name: dev-fastapi-template-postgres
    restart: unless-stopped
    networks:
      - fastapi-template-dev-net
    ports:
      - "${POSTGRES_PORT:-6432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devdb
    volumes:
      - dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: dev-fastapi-template-redis
    restart: unless-stopped
    networks:
      - fastapi-template-dev-net
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  fastapi-template-venv:
  dev_postgres_data:
    name: dev-fastapi-template-postgres-data

networks:
  fastapi-template-dev-net:
    driver: bridge
