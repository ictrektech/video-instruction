name: video-instruction-dev

services:
  app-base:
    profiles: ["_base"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    volumes:
      # Source code — mounted live so uvicorn --reload picks up changes
      - ../src:/app/src
      - ../config:/app/config
      - ../log:/app/log
      - ../alembic.ini:/app/alembic.ini
      - ../alembic:/app/alembic
      # README.md for hatchling build
      - ../README.md:/app/README.md
      # Persist .venv across restarts (but not on host — avoid platform mismatch)
      - video-instruction-venv:/app/.venv
    env_file:
      - ../src/.env
    environment:
      APP_ENV: dev
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    networks:
      - video-instruction-dev-net
    restart: unless-stopped

  app-server:
    extends: app-base
    container_name: dev-video-instruction
    profiles: ["server"]
    ports:
      - "${APP_PORT:-8910}:8910"
      - "${DEV_DEBUG_PORT:-5678}:5678"
    command:
      - bash
      - -c
      - |
        uv sync --frozen --extra dev
        uv pip install debugpy
        exec uv run -m debugpy --listen 0.0.0.0:5678 -m app.__main__

  video-instruction-venv:

networks:
  video-instruction-dev-net:
    driver: bridge
