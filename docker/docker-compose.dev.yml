name: video-instruction-dev



services:
  scene-detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        SERVICE: scene-detect
    container_name: dev-video-detection
    profiles: ["detection"]
    ports:
      - "${SCENE_DETECTION_PORT:-8910}:8910"
    volumes:
      - /data:/data:ro
      - ${UPLOAD_LOCATION}/photos:/photos
      - ../src:/app/src
      - ../config:/app/config
      - ../log:/app/log
      # README.md for hatchling build
      - ../README.md:/app/README.md
      # Persist .venv across restarts (own volume per service)
      - video-instruction-venv-detection:/app/.venv
      # 共享 huey.db（jobs 表 + task 队列）
      - ../data:/app/data
      # worker 也可能处理 structure 任务，需要可写的缓存目录
      - /data/video-structure-cache:/data/video-structure-cache
    environment:
      APP_ENV: dev
      APP_PORT: 8910
      DATA_BASE_PATH: /photos
      STAGING_BASE_PATH: /data/video-structure-cache
      STAGING_TTL_SEC: "604800"
      # 场景检测管道：scale=640 切点稳定；decode_threads=0=auto
      VIDEO_DETECT_SCALE_WIDTH: "640"
      VIDEO_DECODE_THREADS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
      # 限制 OpenMP 线程池，避免 OpenCV/scenedetect 创建数百个 idle 线程
      OMP_NUM_THREADS: "1"
      OPENCV_OPENMP_NUM_THREADS: "1"
    networks:
      - video-instruction-dev-net
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        uv sync --frozen --extra dev --extra scene-detect --extra structure
        # 安装 watchfiles 避免 uvicorn reload stat 轮询造成的 CPU 空转
        uv pip install watchfiles
        # 后台启动 worker（与 API 同进程）
        uv run scene-detect-worker --workers ${HUEY_WORKERS:-2} &
        exec uv run scene-detect

  structure:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        SERVICE: structure
    container_name: dev-video-structure
    profiles: ["structure"]
    ports:
      - "${STRUCTURE_PORT:-8911}:8911"
    volumes:
      - /data:/data:ro                                                   # 读：宿主机 /data/ 下任意路径（无需翻译）
      - ${UPLOAD_LOCATION}/photos:/photos                                # 读：immich 照片（兼容相对路径模式）
      - ../src:/app/src
      - ../config:/app/config
      - ../log:/app/log
      - ../README.md:/app/README.md
      # Persist .venv across restarts (own volume per service)
      - video-instruction-venv-structure:/app/.venv
      # 写：集中式缓存（与输入路径解耦）
      - /data/video-structure-cache:/data/video-structure-cache
      # 共享 huey.db（jobs 表 + task 队列）
      - ../data:/app/data
    environment:
      APP_ENV: dev
      APP_PORT: 8911
      DATA_BASE_PATH: /photos
      STAGING_BASE_PATH: /data/video-structure-cache
      STAGING_TTL_SEC: "604800"
      VIDEO_GRID_FFMPEG_THREADS: "0"
      LLM_BASE_URL: http://10.144.144.232:21436/v1
      LLM_API_KEY: sk-fake
      LLM_MODEL_NAME: minicpm-v:latest
      LLM_MAX_CONCURRENCY: 20
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple/
      # 限制 OpenMP 线程池，避免 OpenCV/scenedetect 创建数百个 idle 线程
      OMP_NUM_THREADS: "1"
      OPENCV_OPENMP_NUM_THREADS: "1"
    networks:
      - video-instruction-dev-net
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        uv sync --frozen --extra dev --extra scene-detect --extra structure
        # 安装 watchfiles 避免 uvicorn reload stat 轮询造成的 CPU 空转
        uv pip install watchfiles
        # 后台启动 worker（与 API 同进程）
        uv run structure-worker --workers ${HUEY_WORKERS:-2} &
        exec uv run structure
volumes:
  video-instruction-venv-detection:
  video-instruction-venv-structure:

networks:
  video-instruction-dev-net:
    driver: bridge
