name: video-instruction-test



services:
  scene-detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: scene-detect
    image: swr.cn-southwest-2.myhuaweicloud.com/ictrek/video-instruction-detection:${IMAGE_TAG:-latest}
    container_name: test-video-detection
    command:
      - bash
      - -c
      - |
        set -e
        uv run scene-detect-worker --workers ${HUEY_WORKERS:-2} &
        exec uv run scene-detect
    ports:
      - "${SCENE_DETECTION_PORT:-8910}:8910"
    environment:
      APP_ENV: prod
      APP_PORT: 8910
      DATA_BASE_PATH: /data
    volumes:
      - ../log:/app/log
      - immich-photos:/data
      - ../data:/app/data
    networks:
      - video-instruction-net
    restart: unless-stopped

  structure:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: structure
    image: swr.cn-southwest-2.myhuaweicloud.com/ictrek/video-instruction-structure:${IMAGE_TAG:-latest}
    container_name: test-video-structure
    command:
      - bash
      - -c
      - |
        set -e
        uv run structure-worker --workers ${HUEY_WORKERS:-2} &
        exec uv run structure
    ports:
      - "${STRUCTURE_PORT:-8911}:8911"
    environment:
      APP_ENV: prod
      APP_PORT: 8911
      DATA_BASE_PATH: /data
      LLM_BASE_URL: http://10.144.144.232:21436/v1
      LLM_API_KEY: sk-fake
      LLM_MODEL_NAME: minicpm-v:latest
      LLM_MAX_CONCURRENCY: 20
    volumes:
      - ../log:/app/log
      - immich-photos:/data
      - ../data:/app/data
    networks:
      - video-instruction-net
    restart: unless-stopped
volumes:
  immich-photos:
    name: dev-immich-photos
    driver: local
    driver_opts:
      type: none
      device: ${UPLOAD_LOCATION}/photos
      o: bind

networks:
  video-instruction-net:
    driver: bridge
