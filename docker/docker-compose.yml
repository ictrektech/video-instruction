name: video-structure


services:
  # 单镜像：两个服务共用同一镜像，仅 command 与 APP_PORT 不同（Dockerfile 不再按 SERVICE 区分）
  scene-detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: swr.cn-southwest-2.myhuaweicloud.com/ictrek/video-structure:${IMAGE_TAG:-latest}
    container_name: video-structure-detect
    command:
      - bash
      - -c
      - |
        set -e
        uv run scene-detect-worker --workers ${HUEY_WORKERS:-2} &
        exec uv run scene-detect
    ports:
      - "${SCENE_DETECTION_PORT:-8910}:8910"
    environment:
      APP_ENV: prod
      APP_PORT: 8910
      DATA_BASE_PATH: /photos
      STAGING_BASE_PATH: /data/video-structure-cache
      STAGING_TTL_SEC: "604800"
      # 场景检测管道：scale=640 切点稳定；decode_threads=0=auto
      VIDEO_DETECT_SCALE_WIDTH: "640"
      VIDEO_DECODE_THREADS: "0"
      # 限制 OpenMP 线程池，避免 OpenCV/scenedetect 创建数百个 idle 线程
      OMP_NUM_THREADS: "1"
      OPENCV_OPENMP_NUM_THREADS: "1"
    volumes:
      - /data:/data:ro
      - ../log:/app/log
      - ${UPLOAD_LOCATION}/photos:/photos
      - ../data:/app/data
      # worker 也可能处理 structure 任务，需要可写的缓存目录
      - /data/video-structure-cache:/data/video-structure-cache
    networks:
      - video-structure-net
    restart: unless-stopped

  structure:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: swr.cn-southwest-2.myhuaweicloud.com/ictrek/video-structure:${IMAGE_TAG:-latest}
    container_name: video-structure
    command:
      - bash
      - -c
      - |
        set -e
        uv run structure-worker --workers ${HUEY_WORKERS:-2} &
        exec uv run structure
    ports:
      - "${STRUCTURE_PORT:-8911}:8911"
    environment:
      APP_ENV: prod
      APP_PORT: 8911
      DATA_BASE_PATH: /photos
      STAGING_BASE_PATH: /data/video-structure-cache
      STAGING_TTL_SEC: "604800"
      VIDEO_GRID_FFMPEG_THREADS: "0"
      LLM_BASE_URL: http://10.144.144.232:21436/v1
      LLM_API_KEY: sk-fake
      LLM_MODEL_NAME: minicpm-v:latest
      LLM_MAX_CONCURRENCY: 20
      # 限制 OpenMP 线程池，避免 OpenCV/scenedetect 创建数百个 idle 线程
      OMP_NUM_THREADS: "1"
      OPENCV_OPENMP_NUM_THREADS: "1"
    volumes:
      - /data:/data:ro
      - ../log:/app/log
      - ${UPLOAD_LOCATION}/photos:/photos
      - /data/video-structure-cache:/data/video-structure-cache
      - ../data:/app/data
    networks:
      - video-structure-net
    restart: unless-stopped

networks:
  video-structure-net:
    driver: bridge
