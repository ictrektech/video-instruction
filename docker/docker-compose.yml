name: video-instruction

services:
  scene-detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: scene-detect
    image: ${REGISTRY:-swr.cn-southwest-2.myhuaweicloud.com/ictrek}/video-instruction-detection:${IMAGE_TAG:-latest}
    container_name: video-instruction-detection
    command: uv run scene-detect
    ports:
      - "${SCENE_DETECTION_PORT:-8910}:8910"
    env_file:
      - ../src/.env
    environment:
      APP_ENV: prod
      APP_PORT: 8910
      DATA_BASE_PATH: /data/video-structured
    volumes:
      - ../log:/app/log
      - ${DATA_BASE_PATH:-/data/video-structured}:/data/video-structured
    networks:
      - video-instruction-net
    restart: unless-stopped

  structure:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: structure
    image: ${REGISTRY:-swr.cn-southwest-2.myhuaweicloud.com/ictrek}/video-instruction-structure:${IMAGE_TAG:-latest}
    container_name: video-instruction-structure
    command: uv run structure
    ports:
      - "${structure_PORT:-8911}:8911"
    env_file:
      - ../src/.env
    environment:
      APP_ENV: prod
      APP_PORT: 8911
      DATA_BASE_PATH: /data/video-structured
    volumes:
      - ../log:/app/log
      - ${DATA_BASE_PATH:-/data/video-structured}:/data/video-structured
    networks:
      - video-instruction-net
    restart: unless-stopped

networks:
  video-instruction-net:
    driver: bridge
