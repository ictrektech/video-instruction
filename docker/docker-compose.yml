name: video-instruction

services:
  scene-detection:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: scene-detect
    image: swr.cn-southwest-2.myhuaweicloud.com/ictrek/video-instruction-detection:${IMAGE_TAG:-latest}
    container_name: video-instruction-detection
    command: uv run scene-detect
    ports:
      - "${SCENE_DETECTION_PORT:-8910}:8910"
    environment:
      APP_ENV: prod
      APP_PORT: 8910
      DATA_BASE_PATH: /photos
    volumes:
      - /data:/data:ro
      - ../log:/app/log
      - ${UPLOAD_LOCATION}/photos:/photos
    networks:
      - video-instruction-net
    restart: unless-stopped

  structure:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: structure
    image: swr.cn-southwest-2.myhuaweicloud.com/ictrek/video-instruction-structure:${IMAGE_TAG:-latest}
    container_name: video-instruction-structure
    command: uv run structure
    ports:
      - "${STRUCTURE_PORT:-8911}:8911"
    environment:
      APP_ENV: prod
      APP_PORT: 8911
      DATA_BASE_PATH: /photos
      CACHE_BASE_PATH: /data/video-structure-cache
      LLM_BASE_URL: http://10.144.144.232:21436/v1
      LLM_API_KEY: sk-fake
      LLM_MODEL_NAME: minicpm-v:latest
      LLM_MAX_CONCURRENCY: 20
    volumes:
      - /data:/data:ro
      - ../log:/app/log
      - ${UPLOAD_LOCATION}/photos:/photos
      - /data/video-structure-cache:/data/video-structure-cache
    networks:
      - video-instruction-net
    restart: unless-stopped

networks:
  video-instruction-net:
    driver: bridge
