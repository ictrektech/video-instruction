name: video-instruction

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${REGISTRY:-swr.cn-southwest-2.myhuaweicloud.com/ictrek}/video-instruction:${IMAGE_TAG:-latest}
    container_name: video-instruction-server
    ports:
      - "${APP_PORT:-8910}:8910"
    env_file:
      - ../src/.env
    environment:
      APP_ENV: prod
    volumes:
      - ../log:/app/log
    networks:
      - video-instruction-net
    restart: unless-stopped

  app_log:

networks:
  video-instruction-net:
    driver: bridge
